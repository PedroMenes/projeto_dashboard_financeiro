# Publica a versao web do app Flutter no GitHub Pages.
#
# Resultado: https://pedromenes.github.io/projeto_dashboard_financeiro/
# Qualquer pessoa abre o link e usa o sistema no navegador, sem instalar nada.
#
# Os dados continuam no aparelho de quem acessa -- na web o SQLite roda
# compilado em WebAssembly e guarda tudo no IndexedDB do proprio navegador.
# Ou seja: cada visitante tem o seu banco, e nada e enviado para servidor.

name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nao cancela uma publicacao em andamento, para nao deixar o site
# pela metade; apenas enfileira a proxima.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    name: Compilar versao web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app_flutter

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Preparar o Pages
        uses: actions/configure-pages@v5

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Baixar as dependencias
        run: flutter pub get

      # O site nao fica na raiz do dominio, e sim em /nome-do-repositorio/.
      # Sem o base-href o app procuraria os arquivos no lugar errado e
      # abriria em branco.
      - name: Compilar para web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app_flutter/build/web

  publicar:
    name: Publicar no GitHub Pages
    runs-on: ubuntu-latest
    needs: compilar

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
