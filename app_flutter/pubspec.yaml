name: financeiro_app
description: "Controle Financeiro NERV - app mobile e desktop"
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  sqflite_common_ffi_web: ^1.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  crypto: ^3.0.8
  fl_chart: ^1.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Variable.ttf
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
